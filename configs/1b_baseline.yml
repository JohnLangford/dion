
# — Model —
model_dim: 1536
n_layer: 24
n_head: 16
use_bias: false
sequence_length: 1024

# — Batching & Training —
batch_size: 8
device_batch_size: 8
num_iterations: 100

# — Learning‐rate schedule —
warmup_ratio: 0.0
warmdown_ratio: 0.2

# — Validation & Checkpointing —
val_loss_every: 125
val_tokens: 32768

# — Distributed training —
fs_size: null      # FSDP size

# — Optimizer & Hyperparameters —
optimizer: muon
scalar_opt: adamw
mu: 0.95
weight_decay: 0.01
adjust_lr: spectral_norm
lr: 0.02
use_polar_express: true
split_heads: false
time_optimizer: true

# NOTE: no_triton / use_gns_package / use_gns_alg are intentionally omitted here
# (they default off) and are toggled per-variant via CLI flags in run_variants.sh.
